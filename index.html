<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grimório</title><meta name="theme-color" content="#0e1014"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style id="css">
:root{
  --bg:#0e1014;--surface:#161920;--surface2:#1d212a;--border:#272c36;--border2:#3a4050;
  --text:#eceef2;--muted:#8a909c;--faint:#5c6270;
  --accent:#8b7bff;--accent-ink:#0e1014;--hover:#242935;--text2:#d6d9e0;--display:'Space Grotesk',Inter,sans-serif;--body:Inter,system-ui,sans-serif;--shade:14 16 20;
  --low:#f87171;--mid:#fb923c;--good:#4ade80;--top:#facc15;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:960px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.top h1{font-size:26px;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,transform .05s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;border-color:transparent;color:var(--low);padding-left:4px}
.btn.danger.confirm{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-6px 0 18px}
.tab{text-decoration:none;padding:10px 16px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab small{font-size:12px;font-weight:600;background:var(--surface2);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tab.on small{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.giv .poster img,.giv .poster .ph{filter:grayscale(.55) brightness(.8)}
.gbadge{position:absolute;right:8px;top:8px;background:rgb(var(--shade) / .78);backdrop-filter:blur(6px);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--text2)}
.giv-only,.zer-only,.nojor{display:contents}
.mode-jor .nojor,.mode-jor .jhide{display:none!important}
.jor .gbadge{color:var(--accent)}
.mode-giv .zer-only{display:none}
.mode-zer .giv-only{display:none}
.statusSeg{margin-top:-4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.toolbar input,.toolbar select,.sheet input,.sheet select,.sheet textarea{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;width:100%}
.toolbar input,.toolbar select{background:var(--surface)}
.toolbar input{flex:1 1 220px;width:auto;min-width:0}
.toolbar select{flex:0 1 auto;width:auto;cursor:pointer}
.toolbar input:focus,.toolbar select:focus,.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip:hover{border-color:var(--border2);color:var(--text)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.fchip small{opacity:.7;font-size:11.5px}
.filters select{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;outline:none}
.filters select.on{border-color:var(--accent);color:var(--accent)}
.scope{color:var(--muted);font-size:13px;margin:0 2px 10px}
.scope b{color:var(--text)}
.scope .clear{margin-left:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gitem{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--border);cursor:zoom-in;padding:0}
.gitem img,.gitem video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:40px;height:40px;border-radius:50%;background:rgb(var(--shade) / .7);display:grid;place-items:center;color:#fff;font-size:15px;padding-left:3px;backdrop-filter:blur(4px)}
.galed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;border-radius:10px;outline:none}
.galed.drag{box-shadow:0 0 0 2px var(--accent)}
.galed.target{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.galed .gitem{cursor:default}
.galed .gitem .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:7px;border:none;background:rgb(var(--shade) / .85);color:#fff;cursor:pointer;font-size:14px;line-height:1;z-index:1}
.gadd{aspect-ratio:16/10;border:1px dashed var(--border2);border-radius:10px;background:var(--bg);color:var(--faint);cursor:pointer;font-size:13px}
.gadd:hover{border-color:var(--accent);color:var(--accent)}
.gpend{aspect-ratio:16/10;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--faint);font-size:12px}
.lbstage{max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.lbstage img,.lbstage video{max-width:calc(100vw - 120px);max-height:calc(100vh - 80px);border-radius:8px;cursor:default}
.lbnav,.lbx{position:absolute;background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;border-radius:12px}
.lbnav{top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:30px}
.lbnav:hover,.lbx:hover{background:rgba(255,255,255,.16)}
.lbnav.prev{left:14px}.lbnav.next{right:14px}
.lbx{top:14px;right:14px;width:40px;height:40px;font-size:24px}
.lbcount{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:13px}
.year{display:flex;align-items:baseline;gap:8px;margin:24px 2px 12px;font-family:var(--display);font-weight:700;font-size:16px}
.year small{color:var(--faint);font-family:var(--body);font-weight:500;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:7px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);transition:transform .15s,border-color .15s}
.card:hover .poster{transform:translateY(-3px);border-color:var(--border2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;color:rgba(255,255,255,.85);padding:10px;text-align:center}
.poster .score{position:absolute;left:8px;bottom:8px;box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.badge{position:absolute;right:8px;top:8px;background:rgb(var(--shade) / .75);backdrop-filter:blur(6px);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600}
.cname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{color:var(--muted);font-size:12px;margin-top:-4px}
.plat{color:var(--faint)}
.score{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.s-low{background:rgba(60,22,24,.88);color:var(--low)}
.s-mid{background:rgba(62,37,18,.88);color:var(--mid)}
.s-good{background:rgba(20,52,33,.88);color:var(--good)}
.s-top{background:rgba(60,52,10,.9);color:var(--top)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;border:1px dashed var(--border);border-radius:14px;margin-top:18px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:36px;color:var(--faint);font-size:12px}
.link{background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:3px;font-size:12px}
.link:hover{color:var(--muted)}
/* detail */
.dnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.dnav .r{display:flex;gap:8px}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.2);opacity:.45}
.hero-in{position:relative;display:flex;gap:24px;padding:28px;align-items:flex-end;background:linear-gradient(180deg,rgb(var(--shade) / .1),rgb(var(--shade) / .75))}
.hero .poster{width:170px;flex:none;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.hero .poster .ph{font-size:40px}
.hero-txt{flex:1;min-width:0}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kicker .plat{color:var(--muted);opacity:.75}
.hero h1{font-size:40px;margin:6px 0 8px;line-height:1.05}
.headline{font-size:17px;color:var(--text2);margin:0 0 14px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500}
.bigscore{flex:none;text-align:center;padding:14px 18px;border-radius:16px;align-self:flex-start}
.bigscore b{display:block;font-family:var(--display);font-size:52px;line-height:1}
.bigscore small{font-size:12px;opacity:.8;font-weight:600}
.dbody{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--body);font-weight:600}
.panel p{margin:0;line-height:1.65;font-size:15px;color:var(--text2)}
.photo{display:block;width:100%;max-height:560px;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;gap:10px;font-size:14.5px;line-height:1.5;color:var(--text2)}
.plist li:before{content:'+';flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(74,222,128,.12);color:var(--good);margin-top:1px}
.plist.cons li:before{content:'–';background:rgba(248,113,113,.12);color:var(--low)}
.journey{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14.5px}
.journey .ar{color:var(--faint)}
.journey b{font-family:var(--display)}
.journey .tot{margin-left:auto;color:var(--muted);font-size:13px}
.blank{color:var(--muted);font-size:14px}
.permalink{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:12px;margin-top:18px;word-break:break-all}
.lightbox{position:fixed;inset:0;background:rgb(var(--shade) / .94);display:flex;align-items:center;justify-content:center;z-index:30;cursor:zoom-out;padding:20px}
.lightbox[hidden]{display:none}
/* editor */
.overlay{position:fixed;inset:0;background:rgb(var(--shade) / .7);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:28px 18px 0;z-index:10;overflow-y:auto}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 22px 0;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto 0 28px}
.sheet.small{max-width:460px;padding-bottom:22px}
.sheet h2{margin:0;font-size:21px}
.shead{display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--surface2);color:var(--text)}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;margin-top:8px;padding-top:14px;border-top:1px solid var(--border)}
.sec.first{border-top:none;padding-top:0;margin-top:0}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.opt{color:var(--faint);font-weight:400}
.sheet input,.sheet select{color-scheme:dark}
.sheet textarea{resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.edtop{display:flex;gap:16px}
.edf{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.imgbox{position:relative;border:1px dashed var(--border2);background:var(--bg);border-radius:10px;display:grid;place-items:center;cursor:pointer;overflow:hidden;color:var(--faint);font-size:13px;text-align:center;transition:border-color .15s,box-shadow .15s;outline:none}
.imgbox:hover,.imgbox.drag{border-color:var(--accent);color:var(--accent)}
.imgbox.target{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.imgbox img{width:100%;height:100%;object-fit:cover;display:block}
.imgbox .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:none;background:rgb(var(--shade) / .8);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.cover-box{width:110px;flex:none;aspect-ratio:2/3}
.photo-box{width:100%;aspect-ratio:16/9}
.small-note{margin:-6px 0 0;color:var(--faint);font-size:12px}
.small-note a,.edf a{color:var(--accent);text-decoration:none;font-weight:600;font-size:12.5px}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.rate{border:1px solid var(--border);background:var(--surface2);border-radius:8px;height:40px;font-weight:700;font-family:var(--display);font-size:15px;cursor:pointer;color:var(--muted);padding:0}
.rate:hover{border-color:var(--border2);color:var(--text)}
.rate.on{border-color:currentColor}
.rate:not(.on){background:var(--surface2)!important}
.rates.err{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--border);background:var(--surface2);border-radius:9px;padding:9px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hint{color:var(--low);font-size:12.5px;min-height:0}
.actions{display:flex;gap:8px;align-items:center}
.sticky{position:sticky;bottom:0;background:var(--surface);margin:0 -22px;padding:14px 22px 18px;border-top:1px solid var(--border);border-radius:0 0 18px 18px}
.sp{flex:1}
.sheet.small textarea{min-height:180px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:40;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  .app{padding:20px 14px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .tab{padding:10px 12px;font-size:14px}
  .top .btn{white-space:nowrap;padding:9px 12px;font-size:13px}
  .top h1{font-size:22px}
  .stat b{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px 10px}
  .hero-in{flex-direction:column;align-items:flex-start;padding:20px;gap:16px}
  .hero .poster{width:120px}
  .hero h1{font-size:30px}
  .bigscore{position:absolute;right:18px;top:18px}
  .two{grid-template-columns:1fr}
  .overlay{padding:0}
  .sheet{border-radius:0;min-height:100%;border:none;margin:0}
  .sticky{border-radius:0}
  .rates{grid-template-columns:repeat(5,1fr)}
  .row3{grid-template-columns:1fr 1fr}
  .toolbar select{flex:1 1 40%}
  .lbstage img,.lbstage video{max-width:100vw;max-height:calc(100vh - 120px)}
  .lbnav{top:auto;bottom:10px;transform:none;height:48px}
  .gal{grid-template-columns:repeat(2,1fr)}
}
/* ---------- theme picker ---------- */
.hbtns{display:flex;gap:8px;align-items:center}
.hbtns .btn.ghost{padding:10px 12px;font-size:16px}
.tsheet{max-width:640px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:5px;text-align:left;border:2px solid var(--border);background:var(--surface2);border-radius:12px;padding:8px;cursor:pointer;color:var(--text)}
.tcard:hover{border-color:var(--border2)}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.tprev{display:block;position:relative;height:78px;border-radius:7px;overflow:hidden}
.tprev i{position:absolute;display:block}
.tcard b{font-size:13.5px;margin:3px 2px 0;font-weight:700}
.tcard small{font-size:11.5px;color:var(--muted);margin:0 2px 2px;line-height:1.35}
/* ---------- themes ---------- */
[data-theme="souls"]{--bg:#0c0a07;--surface:#15120d;--surface2:#1d1912;--hover:#28221a;--border:#2c261c;--border2:#4a3f2c;--text:#efe6d2;--text2:#d9ccb0;--muted:#9c8e73;--faint:#6b604c;--accent:#c9a45a;--accent-ink:#130f08;--display:'Cinzel',Georgia,serif;--shade:12 10 7}
[data-theme="souls"] body{background:radial-gradient(ellipse 120% 55% at 50% -10%,#2b2112 0%,transparent 60%),var(--bg)}
[data-theme="souls"] .logo{background:linear-gradient(160deg,#e3c784,#946f2c)}
[data-theme="souls"] .stat,[data-theme="souls"] .panel{background:linear-gradient(180deg,var(--surface2),var(--surface))}
[data-theme="souls"] .panel h3,[data-theme="souls"] .sec,[data-theme="souls"] .kicker{font-family:var(--display);letter-spacing:.16em}
[data-theme="souls"] .top h1,[data-theme="souls"] .hero h1{letter-spacing:.02em;text-shadow:0 2px 18px rgba(201,164,90,.25)}

[data-theme="cyber"]{--bg:#09090d;--surface:#111118;--surface2:#181822;--hover:#22222f;--border:#2a2a38;--border2:#4a4a60;--text:#f3f3f3;--text2:#d4d4de;--muted:#8f8fa6;--faint:#5c5c72;--accent:#fcee0a;--accent-ink:#09090d;--display:'Orbitron',Inter,sans-serif;--shade:9 9 13}
[data-theme="cyber"] body{background-image:linear-gradient(rgba(252,238,10,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(252,238,10,.035) 1px,transparent 1px);background-size:44px 44px}

/* theme picker as side panel (live preview) */
#tmodal{background:transparent;backdrop-filter:none;pointer-events:none;justify-content:flex-end;align-items:stretch;padding:0;overflow:visible}
#tmodal .tsheet{pointer-events:auto;width:390px;max-width:100%;height:100vh;border-radius:0;margin:0;overflow-y:auto;padding:20px 18px 0;border-width:0 0 0 1px;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
#tmodal .tgrid{grid-template-columns:1fr 1fr}
#tmodal .actions{position:sticky;bottom:0;background:var(--surface);margin:0 -18px;padding:14px 18px 18px;border-top:1px solid var(--border)}
@media (min-width:900px){ body.tpanel{padding-right:390px} }
@media (max-width:640px){
  #tmodal{align-items:flex-end}
  #tmodal .tsheet{width:100%;height:50vh;min-height:0;border-radius:18px 18px 0 0;border:1px solid var(--border);border-width:1px 0 0}
  #tmodal .tgrid{grid-template-columns:1fr 1fr;gap:8px}
  #tmodal .tprev{height:56px}
  body.tpanel{padding-bottom:50vh}
}

    var r = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
    $('lBtn').disabled = false; $('lBtn').textContent = 'Entrar';
    if (r.error) { $('lHint').textContent = 'E-mail ou senha incorretos.'; return; }
    user = r.data.user; showLogin(false); loadAll();
  });
  $('logoutBtn').onclick = async function(){
    await sb.auth.signOut(); user = null; games = []; prefs = {}; synced = {}; applyTheme(''); route(); showLogin(true);
  };
  document.addEventListener('visibilitychange', function(){
    // ao voltar para o app, busca o que foi salvo no outro aparelho
    if (document.visibilityState === 'visible' && user && !saveTimer && $('modal').hidden && $('tmodal').hidden) loadAll(true);
  });
  async function boot(){
    var s = await sb.auth.getSession();
    user = s.data && s.data.session ? s.data.session.user : null;
    if (!user) { route(); showLogin(true); return; }
    loadAll();
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  boot();
})();
</script>
</body>
</html>
